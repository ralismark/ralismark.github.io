<?xml version="1.0" encoding="UTF-8"?>
<svg
	xmlns:xlink="http://www.w3.org/1999/xlink"
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 210 297"
>
	<!-- A4 paper, scale: 1px = 1mm -->

	<style>
		svg {
			background: white;

			fill: none;
			stroke: black;
			stroke-width: 0.1;

			text-anchor: middle;
			font-size: 25%;
		}

		text {
			stroke: none;
			fill: black;
			white-space: pre-line;
		}
	</style>

	<!-- A4 size -->
	<rect stroke="red" width="100%" height="100%" />
	<!-- danger zone -->

	<text x="20" y="20" text-anchor="start">
		SHELLEY
		by temmie :>
		~~~
		print A4 with no margins
		no seam allowances included
		~~~
		(sorry if instructions are too brief
		and don't make sense...)

		1. stitch together pairs, excluding side to BODY,
		   for TAIL, HEAD, HIND, FORE
		2. stitch BODY together with FORE,
		   HIND, and TAIL, leaving large opening
		   at top for filling &amp; invert BODY
		3. fill HEAD, stitch closed, rotated,
		   to BODY
		4. fill BODY, ladder-stitch closed
	</text>

	<!-- - - - - - - - - - - - -->

	<g
		id="body"
		transform="translate(105,200)"
	>
		<circle r="75" />
		<text>BODY
		cut pair

		(radius 75mm)</text>
	</g>

	<g
		id="head"
		transform="translate(160,90)"
	>
		<path
			d="
				M -16 40
				l -8 -35
				a 25 25 0 1 1 48 0
				l -8 35
				z
			"
		/>
		<text>HEAD
		cut pair</text>
	</g>

	<g
		id="tail"
		transform="translate(105,95)"
	>
		<path
			d="
				M -20 15
				a 75 75 0 0 1 40 0
				q -10 -25 -20 -31
				q -10 6 -20 31
			"
		/>
		<text>TAIL
		cut pair</text>
	</g>

	<g
		id="fore"
		transform="translate(115,20)"
	>
		<path
			d="
				M 0 0
				a 75 75 0 0 0 38 0
				c 10 6 15 2 27 5
				s 4 8 0 11
				S 23 44 0 0
			"
		/>
		<text x="35" y="10">FORE
		cut 2 mirrored pairs</text>
	</g>

	<g
		id="hind"
		transform="translate(80,35)"
	>
		<path
			d="
				M 0 0
				a 75 75 0 0 0 28 0
				l 18 30
				q 2.2 3.5 -1.5 4.5
				C 30 39 -5 25 0 0
			"
		/>
		<text x="20" y="8">HIND
		cut 2
		mirrored
		pairs</text>
	</g>
</svg>
